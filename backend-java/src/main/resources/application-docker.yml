# Docker 内部通过服务名访问 PostgreSQL。容器自身保持安全默认值，本地 Compose 会显式允许 HTTP。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/biorag}
    username: ${DB_USERNAME:biorag}
    password: ${DB_PASSWORD:biorag_dev}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

app:
  require-admin-email: true

logging:
  level:
    root: INFO
    com.biorag.platform: INFO
