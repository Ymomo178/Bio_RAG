spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: bio-rag-backend
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  admin-email: ${APP_ADMIN_EMAIL:}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:300s}
  storage:
    root: ${UPLOAD_ROOT:../uploads}
    artifact-root: ${UPLOAD_ARTIFACT_ROOT:../artifacts/uploads}
    repository-root: ${REPOSITORY_ROOT:..}
