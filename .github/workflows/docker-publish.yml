name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # AI 镜像包含 CUDA 运行库，构建和推送时间较长；后续提交不应取消正在发布的镜像。
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            image: bio-rag-web
            context: ./web
            dockerfile: ./web/Dockerfile
            build_args: |
              DOCKER_REGISTRY=docker.io
          - service: backend-java
            image: bio-rag-backend-java
            context: ./backend-java
            dockerfile: ./backend-java/Dockerfile
            build_args: |
              DOCKER_REGISTRY=docker.io
              MAVEN_MIRROR_URL=https://repo.maven.apache.org/maven2
          - service: ai-service
            image: bio-rag-ai-service
            context: ./ai-service-python
            dockerfile: ./ai-service-python/Dockerfile
            build_args: |
              DOCKER_REGISTRY=docker.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize owner name
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
